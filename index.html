.seal {width:100px}.blessing,.signature,.date {font-style:italic}.blessing,.divider {color:var(--gold)}
.label {font:600 .75rem/1.8 system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase}
h1,h2,h3,p {overflow-wrap:anywhere}
h1,h2,h3 {font-weight:400;line-height:1.2}
h1 {font-size:clamp(2.6rem,6.5vw,5.8rem);margin:16px auto;color:var(--gold)}
h1 span {display:block;font-size:.45em;font-style:italic;line-height:1.3}
h2 {font-size:clamp(2.1rem,5vw,3.8rem);margin:0 0 24px}
.divider {display:flex;align-items:center;gap:12px;justify-content:center;margin:22px auto}
.divider:before,.divider:after {content:"";width:44px;border-top:1px solid var(--line)}
.choose {font-size:.95rem}.buttons {display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.buttons>* {padding:11px 20px;border:1px solid var(--line);background:transparent;border-radius:3px;text-decoration:none}
.cover button {color:var(--gold);min-width:105px}.buttons>*:hover {background:#bc925225}
nav {display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 5%;background:#fcf5e8;border-bottom:1px solid #d7c5a7}
nav div {display:flex;align-items:center;gap:clamp(10px,3vw,30px)}nav a {text-decoration:none}nav a:hover {text-decoration:underline}
nav button {background:transparent;border:1px solid var(--line);padding:6px 10px;border-radius:3px}
.intro,.dark,footer {text-align:center;padding:clamp(46px,7vw,96px) 6%}
.intro {background-image:radial-gradient(ellipse at top,#662637,transparent 78%);border-bottom:4px double var(--gold)}
.medallion {position:relative;width:140px;margin:0 auto 26px;display:grid;place-items:center}
.medallion img {width:100%}.medallion i {position:absolute;border:1px solid var(--line);border-radius:50%;width:52px;height:52px;display:grid;place-items:center;background:var(--wine);color:var(--gold)}
.count {border-block:1px solid var(--line);display:inline-block;padding:10px 18px;color:var(--gold);font-variant-numeric:tabular-nums}
.paper {width:min(940px,88%);margin:auto;padding:clamp(42px,7vw,84px) 0}
.letter {text-align:center;max-width:650px}.letter img {max-width:100%;max-height:420px;border:6px solid white;transform:rotate(-1deg);margin-bottom:24px}
.letter p:not(.label),.row p,.dark p {line-height:1.7}.signature {font-size:1.45rem;color:#88384c}
.schedule {border-top:1px solid #cdbca1}.row {display:grid;grid-template-columns:minmax(150px,1fr) 3fr;gap:32px;border-top:1px solid #d7c5a7;padding:24px 0}
.row time {color:#87394b;line-height:1.65}.row h3,.place h3 {font-size:1.7rem;margin:0}.row p {margin:7px 0}
.dark h2,.dark a {color:var(--gold)}.place+.place {margin-top:32px}
footer .signature {font-size:2rem}html[lang=hi] h1,html[lang=hi] h2 {line-height:1.45}
@media(max-width:540px){.row {grid-template-columns:1fr;gap:8px}.panel {padding-top:26px}.seal {width:76px}nav {font-size:.9rem}.intro h1 {font-size:2.8rem}}
@media(prefers-reduced-motion:no-preference){html {scroll-behavior:smooth}.intro {animation:reveal .55s ease-out}@keyframes reveal {from{opacity:.25}to{opacity:1}}}

body{background:radial-gradient(ellipse at top,#712f41,#30101e);min-height:100svh}
#inside{width:min(100%,630px);margin:auto;padding:16px 12px 24px}
#inside nav{background:transparent;color:#fce9c7;border:none;padding:8px 4px 16px}
#inside nav button{color:inherit}
#inside nav div>a,.intro .medallion i{display:none}
.leaf{box-sizing:border-box;background:#fff5e5!important;color:#482131;width:100%;min-height:65svh;text-align:center;padding:clamp(25px,6vw,48px) clamp(20px,5vw,45px);border:1px solid #ab7a43;outline:1px solid #c39b61;outline-offset:-8px;border-radius:100px 100px 5px 5px;margin:0;animation:turn .45s ease-out;transform-origin:left}
.leaf h1,.leaf .count,.leaf a,.leaf h2{color:#712c40}.leaf h1{font-size:clamp(2.5rem,8vw,4.5rem)}
.leaf h2{font-size:clamp(2rem,6vw,3rem)}.leaf .medallion{width:92px}.row{display:block;text-align:left;padding:14px 0}.row time{display:block;margin-bottom:8px}.row time br{display:none}.row time br:after{content:" "}.row h3{font-size:1.4rem}.row p{margin:4px 0}
.pager{display:flex;align-items:center;justify-content:space-between;margin:15px 0;color:#ffedce}.pager button{border:1px solid #b68e58;border-radius:40px;background:#501d2d;color:inherit;padding:10px 18px}.pager button:disabled{opacity:.37}
#inside footer{padding:18px 0;color:#ffe7c3}#inside footer .signature{display:none}
@keyframes turn{from{opacity:.4;transform:perspective(900px) rotateY(-8deg)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.leaf{animation:none}}

<div class="pager"><button id="prev"></button><span aria-live="polite" id="page"></span><button id="next"></button></div><footer><p class="signature" id="closing"></p><div class="buttons"><a id="calendar" target="_blank" rel="noopener"></a><a id="rsvp" hidden target="_blank" rel="noopener"></a><a id="share" hidden target="_blank" rel="noopener"></a></div></footer></main><script>const cardData = typeof wedding !== "undefined" ? wedding : {
  groom: ["Jeetendra", "जीतेन्द्र"],
  bride: ["Ananya", "अनन्या"],
  timezone: "Asia/Kolkata",
  city: ["Jaipur, Rajasthan", "जयपुर, राजस्थान"],
  blessing: ["॥ Shree Ganeshaya Namah ॥", "॥ श्री गणेशाय नमः ॥"],
  message: [
    "With the blessings of our elders, we invite you to share in our wedding. Come early for the haldi, stay late for the music, and be beside us as we take our seven vows.",
    "बड़ों के आशीर्वाद से हम आपको अपने विवाह में सादर आमंत्रित करते हैं। हल्दी के रंग, संगीत की महफ़िल और सात फेरों की इस खुशी में हमारे साथ शामिल हों।"
  ],
  families: ["The Sharma & Verma families", "शर्मा एवं वर्मा परिवार"],
  photo: "", // Optional, e.g. "assets/couple.jpg"
  rsvpNumber: "", // Optional WhatsApp number with country code, digits only.
  venues: [
    {name:["The Garden Courtyard","उद्यान प्रांगण"],address:["Jaipur, Rajasthan","जयपुर, राजस्थान"],map:"https://www.google.com/maps/search/?api=1&query=Jaipur+Rajasthan"}
  ],
  // The countdown and cover use the event whose id is "wedding".
  // venue: 0 means the first venue above. Dates include the local UTC offset.
  events: [
    {id:"haldi",name:["Haldi","हल्दी"],start:"2027-02-13T10:00:00+05:30",venue:0,note:["A morning of turmeric, marigolds and family songs. Wear a little yellow.","हल्दी, गेंदे के फूल और मंगल गीत। पीले रंग में पधारें।"]},
    {id:"sangeet",name:["Mehndi & Sangeet","मेहंदी और संगीत"],start:"2027-02-13T17:30:00+05:30",venue:0,note:["Henna in the courtyard, followed by dancing under the lights.","आँगन में मेहंदी और फिर रोशनी के बीच नाच-गाने की शाम।"]},
    {id:"wedding",name:["Wedding & Pheras","शुभ विवाह एवं फेरे"],start:"2027-02-14T19:00:00+05:30",venue:0,note:["Join us for the varmala and seven vows, followed by dinner with both families.","वरमाला और सात फेरों के बाद दोनों परिवारों के साथ रात्रिभोज में शामिल हों।"]}
  ]
};

const byId = id => document.getElementById(id);
const ceremony = cardData.events.find(event => event.id === "wedding");
let language = 0;
const translated = pair => pair[language] || pair[0];
const t = (english, hindi) => translated([english, hindi]);
const names = () => [translated(cardData.groom), translated(cardData.bride)].join(t(" & ", " और "));
function formatDate(start, options) {
  return new Intl.DateTimeFormat(t("en-IN", "hi-IN"), {timeZone: cardData.timezone, ...options}).format(new Date(start));
}
function write(id, value) { byId(id).textContent = value; }
function element(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
function renderEvents() {
  const rows = cardData.events.slice().sort((a,b) => Date.parse(a.start) - Date.parse(b.start)).map(event => {
    const row = document.createElement("article");
    row.className = "row";
    const when = element("time", formatDate(event.start,{weekday:"short",day:"numeric",month:"long"}));
    when.dateTime = event.start;
    when.append(" · ",formatDate(event.start,{hour:"numeric",minute:"2-digit",timeZoneName:"short"}));
    const detail = document.createElement("div");
    const venueLink = element("a", translated(cardData.venues[event.venue].name));
    venueLink.href = "#place-" + event.venue;
    detail.append(element("h3",translated(event.name)),element("p",translated(event.note)),venueLink);
    row.append(when,detail);
    return row;
  });
  byId("rows").replaceChildren(...rows);
  byId("places").replaceChildren(...cardData.venues.map((venue,index) => {
    const box = document.createElement("article");
    box.id = "place-" + index;
    box.className = "place";
    const link = element("a",t("Open in Google Maps ↗","गूगल मैप्स पर देखें ↗"));
    link.href = venue.map;
    link.target = "_blank";
    link.rel = "noopener";
    box.append(element("h3",translated(venue.name)),element("p",translated(venue.address)),link);
    return box;
  }));
}
function countdown() {
  const seconds = Math.max(0,Math.floor((Date.parse(ceremony.start)-Date.now())/1000));
  const days = Math.floor(seconds/86400), hours = Math.floor(seconds/3600)%24, minutes = Math.floor(seconds/60)%60;
  write("count",seconds ? t(days+" days · "+hours+" hrs · "+minutes+" min · "+seconds%60+" sec",days+" दिन · "+hours+" घंटे · "+minutes+" मिनट · "+seconds%60+" सेकंड") : t("Our wedding day has arrived","विवाह की शुभ घड़ी आ गई है"));
}
function render(lang) {
  language = lang;
  document.documentElement.lang = t("en","hi");
  document.title = names() + t(" | Wedding invitation"," | विवाह निमंत्रण");
  const initials = [cardData.groom,cardData.bride].map(pair => pair[0].trim()[0]).join(" · ");
  write("monogram",initials); write("initials",initials);
  write("navEvents",t("Ceremonies","समारोह")); write("navVenues",t("Venues","स्थल"));
  write("language",t("हिन्दी","English"));
  write("inviteLabel",t("Together with our families","अपने परिवारों के साथ"));
  write("title",names()); write("date",formatDate(ceremony.start,{dateStyle:"full"})); write("city",translated(cardData.city));
  write("letterLabel",t("From our families","हमारे परिवारों की ओर से"));
  write("familyTitle",t("A personal invitation","स्नेहिल आमंत्रण"));
  write("message",translated(cardData.message)); write("family",translated(cardData.families));
  write("eventsTitle",t("The wedding ceremonies","विवाह के कार्यक्रम")); write("venuesTitle",t("Venues & directions","समारोह स्थल और मार्ग"));
  write("closing",names()); write("calendar",t("Add to Google Calendar","गूगल कैलेंडर में जोड़ें"));
  const start = new Date(ceremony.start);
  const stamp = date => date.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const venue = cardData.venues[ceremony.venue];
  const params = new URLSearchParams({action:"TEMPLATE",text:names()+" · "+translated(ceremony.name),dates:stamp(start)+"/"+stamp(new Date(+start+3600000)),location:translated(venue.name)+", "+translated(venue.address),ctz:cardData.timezone});
  byId("calendar").href = "https://calendar.google.com/calendar/render?"+params;
  const phone = cardData.rsvpNumber.trim();
  byId("rsvp").hidden = !phone;
  if (phone) {
    write("rsvp",t("RSVP on WhatsApp","व्हाट्सऐप पर जवाब दें"));
    byId("rsvp").href = "https://wa.me/"+phone+"?text="+encodeURIComponent(t("Namaste! I’d like to RSVP for ","नमस्ते! मैं इस विवाह में अपनी उपस्थिति की सूचना देना चाहता/चाहती हूँ। ")+names());
  }
  if (/^https?:$/.test(location.protocol)) {
    byId("share").hidden = false; write("share",t("Share invitation","निमंत्रण साझा करें"));
    byId("share").href = "https://wa.me/?text="+encodeURIComponent(document.title+"\n"+location.href.split("#")[0]);
  }
  if (cardData.photo) {byId("photo").src=cardData.photo;byId("photo").alt=names();byId("photo").hidden=false;}
  renderEvents(); countdown();
}
write("blessing",cardData.blessing[0]);
byId("names").replaceChildren(document.createTextNode(cardData.groom[0]),element("span","&"),document.createTextNode(cardData.bride[0]));
write("coverDate",formatDate(ceremony.start,{day:"numeric",month:"long",year:"numeric"})+" · "+cardData.city[0]);
document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click",() => {
  render(Number(button.dataset.lang)); showPage(0);
  byId("cover").hidden=true; byId("inside").hidden=false;
  byId("title").focus({preventScroll:true});window.scrollTo(0,0);
}));
byId("language").addEventListener("click",()=>{render(1-language);showPage(currentPage);});
setInterval(()=>{if(!byId("inside").hidden) countdown();},1000);

let currentPage=0;
const leaves=[byId("intro"),document.querySelector(".letter"),byId("events"),byId("venues")];
leaves.forEach(leaf=>leaf.classList.add("leaf"));
function showPage(index) {
  currentPage=Math.max(0,Math.min(leaves.length-1,index));
  leaves.forEach((leaf,i)=>leaf.hidden=i!==currentPage);
  write("prev",t("← Back","← पीछे"));write("next",t("Next →","आगे →"));
  write("page",(currentPage+1)+" / "+leaves.length);
  byId("prev").disabled=currentPage===0;byId("next").disabled=currentPage===leaves.length-1;
  window.scrollTo(0,0);
}
byId("prev").onclick=()=>showPage(currentPage-1);
byId("next").onclick=()=>showPage(currentPage+1);
byId("monogram").onclick=e=>{e.preventDefault();showPage(0);};
byId("rows").addEventListener("click",e=>{if(e.target.closest("a")) showPage(3);});
window.addEventListener("keydown",e=>{
  if(!byId("inside").hidden && ["ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();showPage(currentPage+(e.key==="ArrowRight"?1:-1));
  }
});
// After the wedding day in its local time zone, display the closing card.
function localDay(date){
  return new Intl.DateTimeFormat("sv-SE",{timeZone:cardData.timezone,year:"numeric",month:"2-digit",day:"2-digit"}).format(date);
}
function closeAfterWedding(){
  if(localDay(new Date())<=localDay(new Date(ceremony.start)))return;
  byId("inside").hidden=true; byId("cover").hidden=false;
  const panel=document.querySelector(".panel");
  if(panel.dataset.closed)return;
  panel.dataset.closed="1";
  panel.replaceChildren(element("p",cardData.groom[0]+" & "+cardData.bride[0]),element("h1","Thank you"),element("p","आपके स्नेह और आशीर्वाद के लिए धन्यवाद।"));
}
closeAfterWedding();setInterval(closeAfterWedding,30000);
</script></body></html>
